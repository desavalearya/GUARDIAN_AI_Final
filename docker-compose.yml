services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-guardian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-guardian}
      POSTGRES_DB: ${POSTGRES_DB:-guardian}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-guardian} -d ${POSTGRES_DB:-guardian}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - guardian

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - guardian

  clamav:
    image: clamav/clamav:1.4
    volumes:
      - clamav_data:/var/lib/clamav
    expose:
      - "3310"
    restart: unless-stopped
    networks:
      - guardian

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "backend.entrypoint", "api"]
    env_file:
      - .env
    environment:
      POSTFIX_HOST: postfix
      POSTFIX_SUBMISSION_PORT: "587"
      MAIL_DOMAIN: ${MAIL_DOMAIN:-example.com}
      MAILPIT_URL: http://receiver:8025
      DEMO_RECEIVER_ADDRESS: receiver@${DEMO_RECEIVER_DOMAIN:-company-b.test}
      DEMO_RECEIVER_DOMAIN: ${DEMO_RECEIVER_DOMAIN:-company-b.test}
    ports:
      - "8000:8000"
    volumes:
      # Mount trained models into API container for Model Lab
      - ./models:/app/models:ro
      - ./data:/app/data:ro
      # Mount source read-only so code edits apply on `docker compose restart api`
      # instead of requiring an image rebuild.
      - ./backend:/app/backend:ro
      - ./gateway:/app/gateway:ro
      - ./alembic.ini:/app/alembic.ini:ro
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - guardian

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "backend.entrypoint", "worker"]
    env_file:
      - .env
    volumes:
      # Mount trained models into worker container as well (future use)
      - ./models:/app/models:ro
      - ./data:/app/data:ro
      - ./backend:/app/backend:ro
      - ./gateway:/app/gateway:ro
      - ./alembic.ini:/app/alembic.ini:ro
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - guardian

  milter:
    build:
      context: .
      dockerfile: gateway/milter/Dockerfile
    environment:
      INGEST_URL: http://api:8000/api/v1/ingest/raw
      INGEST_API_KEY: ${INGEST_API_KEY:-dev-ingest-key}
      API_HEALTH: http://api:8000/health
      MAIL_DOMAIN: ${MAIL_DOMAIN:-example.com}
      MILTER_SOCKET: inet:8891
      SMTP_SCAN_TIMEOUT_SECONDS: ${SMTP_SCAN_TIMEOUT_SECONDS:-20}
    expose:
      - "8891"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    networks:
      - guardian

  postfix:
    build:
      context: .
      dockerfile: gateway/postfix/Dockerfile
    environment:
      MAIL_DOMAIN: ${MAIL_DOMAIN:-example.com}
      MAIL_HOSTNAME: ${MAIL_HOSTNAME:-mail.example.com}
      DKIM_SELECTOR: ${DKIM_SELECTOR:-guardian}
      RELAYHOST: ${RELAYHOST:-}
      RELAY_USER: ${RELAY_USER:-}
      RELAY_PASSWORD: ${RELAY_PASSWORD:-}
      DEMO_RECEIVER_DOMAIN: ${DEMO_RECEIVER_DOMAIN:-company-b.test}
      DEMO_RECEIVER_HOST: ${DEMO_RECEIVER_HOST:-receiver}
      DEMO_RECEIVER_PORT: ${DEMO_RECEIVER_PORT:-1025}
    ports:
      # Host 2525/2587 avoid clash with other stacks on 25/587
      - "2525:25"
      - "2587:587"
    volumes:
      - opendkim_keys:/etc/opendkim/keys
    restart: unless-stopped
    depends_on:
      milter:
        condition: service_started
    networks:
      - guardian

  # Downstream Company B SMTP server for the end-to-end demo.
  # Mailpit provides a real SMTP listener; UI is fronted by mailpit-ui (:8025)
  # so we can add /compose (Mailpit has no native compose screen).
  receiver:
    image: axllent/mailpit:v1.21
    environment:
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_MAX_MESSAGES: "500"
      MP_SMTP_RELAY_HOST: postfix
      MP_SMTP_RELAY_PORT: "25"
      MP_SMTP_RELAY_STARTTLS: "false"
      MP_SMTP_RELAY_AUTH: none
      MP_SMTP_RELAY_ALLOWED_RECIPIENTS: "@example\\.com$"
      MP_SMTP_RELAY_RETURN_PATH: receiver@${DEMO_RECEIVER_DOMAIN:-company-b.test}
      MP_API_CORS: "*"
    expose:
      - "8025"
    ports:
      - "1025:1025"
    restart: unless-stopped
    depends_on:
      - postfix
    networks:
      - guardian

  # Same URL users already open (:8025). Proxies Mailpit + serves /compose.
  mailpit-ui:
    image: nginx:alpine
    volumes:
      - ./frontend/mailpit-extra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/mailpit-extra/compose.html:/usr/share/nginx/html/compose.html:ro
      - ./frontend/mailpit-extra/compose-inject.js:/usr/share/nginx/html/compose-inject.js:ro
    ports:
      - "8025:80"
    depends_on:
      - receiver
    restart: unless-stopped
    networks:
      - guardian

  mail-client:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend/mail-client:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_DEMO_RECIPIENT: receiver@${DEMO_RECEIVER_DOMAIN:-company-b.test}
      VITE_MAILPIT_URL: http://localhost:8025
    ports:
      - "5173:5173"
    depends_on:
      - api
    networks:
      - guardian

  dashboard:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend/dashboard:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5174"
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5174:5174"
    depends_on:
      - api
    networks:
      - guardian

volumes:
  postgres_data:
  opendkim_keys:
  clamav_data:

networks:
  guardian:
    driver: bridge
