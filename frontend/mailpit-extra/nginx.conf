server {
    listen 80;
    server_name _;
    client_max_body_size 25m;

    location = /pp-compose.js {
        default_type application/javascript;
        alias /usr/share/nginx/html/compose-inject.js;
    }

    location = /compose {
        default_type text/html;
        alias /usr/share/nginx/html/compose.html;
    }

    location / {
        proxy_pass http://receiver:8025;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        # Mailpit CSP only allows nonce scripts, which drops our Compose button.
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src * 'unsafe-inline'; frame-src 'self'; img-src * data: blob:; font-src * data:; media-src 'self'; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self';" always;
        sub_filter '<script src="/dist/app.js' '<script src="/pp-compose.js"></script><script src="/dist/app.js';
        sub_filter_once on;
        sub_filter_types text/html;
    }
}
